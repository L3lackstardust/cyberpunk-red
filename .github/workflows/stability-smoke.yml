name: RED Player Stability Smoke Tests
on:
  pull_request:
    paths:
      - 'index.html'
      - 'character-cyberware.html'
      - 'avatar-creator.html'
      - 'assets/avatar-renderer.js'
      - 'tests/**'
      - 'assets/cyberware-spin/**'
      - '.github/workflows/stability-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Validate anatomical artwork sequences
        run: node tests/validate-cyberware-art.cjs
      - name: Run browser stability tests
        run: node tests/stability-smoke.cjs
