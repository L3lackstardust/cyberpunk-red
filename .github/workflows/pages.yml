
name: Deploy RED Character Console
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install Fantastic Dice engine and assets
        run: |
          mkdir -p vendor/dice-box
          npm pack @3d-dice/dice-box@1.1.4 --pack-destination /tmp
          tar -xzf /tmp/3d-dice-dice-box-1.1.4.tgz -C /tmp
          cp /tmp/package/dist/dice-box.es.min.js vendor/dice-box/
          cp /tmp/package/dist/world.*.js vendor/dice-box/
          cp /tmp/package/dist/Dice*.js vendor/dice-box/
          cp -R /tmp/package/dist/assets vendor/dice-box/assets
          test -f vendor/dice-box/dice-box.es.min.js
          test -d vendor/dice-box/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published player console and cyberware manager
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, time, urllib.request
          base=os.environ['PAGES_URL'].rstrip('/')+'/'
          checks={
              'index.html':['redSaveStatus','cyberpunk-red-console-v1'],
              'character-cyberware.html':['NOT SAVED','Body preset storage unavailable','spinView']
          }
          for path,needles in checks.items():
              url=base+path
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(url,timeout=15) as response:
                          body=response.read().decode('utf-8')
                          if response.status!=200 or not all(n in body for n in needles):
                              raise RuntimeError('Published content does not match expected release')
                      print('VERIFIED',url)
                      break
                  except Exception as error:
                      if attempt==11:
                          raise RuntimeError(f'Published page verification failed: {url}') from error
                      print('Waiting for published page:',url,'attempt',attempt+1)
                      time.sleep(10)
          PY
