<!doctype html><meta charset="utf-8"><title>Terry modular assembly review</title>
<style>body{background:#18242c;color:#eee;font:16px system-ui;margin:24px}#views{display:grid;grid-template-columns:repeat(4,1fr)}figure{margin:4px;background:repeating-conic-gradient(#26333c 0% 25%,#30424d 0% 50%) 0/24px 24px}figure>svg{width:100%;height:440px}select,button{font:inherit;margin:8px}</style>
<h1>Terry modular assembly review</h1><p>Eight-view modular assembly · compare appearance and implant combinations</p>
<select id="outfit"><option>combat</option><option>street</option><option>corporate</option></select><select id="hair"><option>mohawk</option><option>short</option><option>swept</option><option>none</option></select><select id="build"></select><select id="pose"></select><button id="cyber">Toggle bilateral cyberware</button><div id="views"></div>
<script src="assets/terry-artwork.js"></script><script src="assets/avatar-art/terry/modular-v1/atlas-metadata.js"></script><script src="assets/modular-artwork.js"></script>
<script>let cyber=false;for(const key of ['build','pose'])document.getElementById(key).innerHTML=Object.keys(REDModularArtwork[key==='build'?'builds':'poses']).map(v=>'<option>'+v+'</option>').join('');document.getElementById('build').value='male-athletic';function draw(){const a={...REDTerryArtwork.base};for(const k of ['outfit','hair','build','pose'])a[k]=document.getElementById(k).value;a.cyberarm=a.cyberleg=cyber?'both':'none';a.eyes=cyber;document.getElementById('views').innerHTML=Array.from({length:8},(_,i)=>'<figure>'+REDModularArtwork.render({...a,frame:i*6})+'</figure>').join('')}document.querySelectorAll('select').forEach(e=>e.onchange=draw);document.getElementById('cyber').onclick=()=>{cyber=!cyber;draw()};draw();</script>
